<!DOCTYPE html> 
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>เค้าขอโทดดด ให้อภัยเค้าได้ไหมม😓</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background-color: #ffe4e1;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      font-size: 14px;
      position: relative;
    }

    .container {
      width: 90%;
      max-width: 360px;
      padding: 20px;
      background-color: #fff;
      border-radius: 16px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
      text-align: center;
      position: relative;
      z-index: 1;
    }

    h1 {
      font-size: 1.4em;
      margin: 15px 0;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    button {
      padding: 10px 20px;
      font-size: 1em;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s ease;
      min-width: 80px;
    }

    #yesBtn {
      background-color: #4CAF50;
      color: white;
    }

    #noBtn {
      background-color: #f44336;
      color: white;
      z-index: 9999;
    }

    img {
      width: 100%;
      max-width: 220px;
      margin-bottom: 15px;
    }

    @keyframes wiggleZoom {
      0%   { transform: translate(0, 0) scale(1); }
      25%  { transform: translate(-10px, 0) scale(1.05); }
      50%  { transform: translate(10px, 0) scale(1.1); }
      75%  { transform: translate(-5px, 0) scale(1.05); }
      100% { transform: translate(0, 0) scale(1); }
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 1.2em;
      }

      button {
        min-width: 70px;
        padding: 8px 16px;
        font-size: 0.9em;
      }
    }

    @media (min-width: 481px) and (max-width: 768px) {
      h1 {
        font-size: 1.3em;
      }

      .container {
        max-width: 400px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="https://media.tenor.com/GAnWQh5LnF0AAAAM/love.gif" alt="Cute Cat" />
    <h1>เค้าขอโทดดด ให้อภัยเค้าได้ไหมม😓</h1>
    <div class="buttons" id="buttonWrapper">
      <button id="yesBtn">ก็ได้้</button>
      <button id="noBtn">ไม่!</button>
    </div>
  </div>

  <script>
    const noBtn = document.getElementById('noBtn');
    const buttonWrapper = document.getElementById('buttonWrapper');
    let hasMoved = false;

    function moveButton() {
      const btnWidth = noBtn.offsetWidth;
      const btnHeight = noBtn.offsetHeight;
      const padding = 10;

      const maxX = window.innerWidth - btnWidth - padding;
      const maxY = window.innerHeight - btnHeight - padding;

      const containerRect = document.querySelector('.container').getBoundingClientRect();

      let x, y;
      do {
        x = Math.random() * maxX;
        y = Math.random() * maxY;
      } while (
        x + btnWidth > containerRect.left &&
        x < containerRect.right &&
        y + btnHeight > containerRect.top &&
        y < containerRect.bottom
      );

      noBtn.style.animation = 'wiggleZoom 0.4s ease';

      setTimeout(() => {
        noBtn.style.left = `${x}px`;
        noBtn.style.top = `${y}px`;
        noBtn.style.animation = '';
      }, 400);
    }

    function activateMove() {
      if (!hasMoved) {
        buttonWrapper.removeChild(noBtn);
        noBtn.style.position = 'fixed';
        document.body.appendChild(noBtn);
        hasMoved = true;
      }
      moveButton();
    }

    noBtn.addEventListener('mouseover', activateMove);
    noBtn.addEventListener('touchstart', activateMove);

    document.getElementById('yesBtn').addEventListener('click', () => {
      alert("Yay! Let's be Valentines!");
    });
  </script>
</body>
</html>
